name: CI Frontend

on:
  pull_request:

jobs:
  test:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Branch protection requires this check to pass, but a required check
      # that never runs (because paths: filtered it out) blocks the PR
      # forever instead of skipping it. Keep the job always triggered, and
      # gate the actual work per-step instead, so PRs that don't touch
      # frontend/ still get a fast, real "success" instead of needing a bypass.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.frontend == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.filter.outputs.frontend == 'true'
        run: npm ci

      - name: Lint
        if: steps.filter.outputs.frontend == 'true'
        run: npm run lint

      - name: Tests
        if: steps.filter.outputs.frontend == 'true'
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Dependency audit (HU-24)
        if: steps.filter.outputs.frontend == 'true'
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        run: npm run build
