# Local development only (TT-13). Not used in production:
# Vercel/Render/Fly.io don't need Docker to deploy this project (see plan section 9.3).
services:
  postgres:
    image: postgres:16
    container_name: inventario-postgres-dev
    environment:
      POSTGRES_DB: inventario_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d inventario_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
