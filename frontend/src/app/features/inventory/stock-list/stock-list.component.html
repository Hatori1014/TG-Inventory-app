<h1>Stock actual</h1>
<a routerLink="/dashboard">Volver</a>

<div>
  <select [(ngModel)]="filterProductId" (ngModelChange)="reload()">
    <option value="">Todos los productos</option>
    @for (product of products(); track product.id) {
      <option [value]="product.id">{{ product.name }}</option>
    }
  </select>

  <select [(ngModel)]="filterLocationId" (ngModelChange)="reload()">
    <option value="">Todas las ubicaciones</option>
    @for (location of locations(); track location.id) {
      <option [value]="location.id">{{ location.name }}</option>
    }
  </select>
</div>

@if (errorMessage) {
  <p role="alert">{{ errorMessage }}</p>
}

@if (loading()) {
  <p>Cargando...</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Producto</th>
        <th>Ubicación</th>
        <th>Cantidad</th>
      </tr>
    </thead>
    <tbody>
      @for (row of stock(); track row.id) {
        <tr>
          <td>{{ row.product.name }}</td>
          <td>{{ row.location.name }}</td>
          <td>{{ row.quantity }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">No hay stock registrado para este filtro.</td>
        </tr>
      }
    </tbody>
  </table>
}
